<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11102a">
<title>חידון חנוכה בטכנודע</title>
<style>
:root{color-scheme:dark;--ink:#fff8ed;--muted:#c7c1df;--gold:#ffcf72;--line:#494063;--paper:#201b38;--green:#83efae;--red:#ffaaa7;font-family:Rubik,"Arial Hebrew",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;color:var(--ink);background:radial-gradient(ellipse at 80% 0%,#4b2750 0,transparent 48%),radial-gradient(ellipse at 0% 100%,#262456,transparent 52%),#11102a}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a7dbff;outline-offset:4px}
button:disabled{cursor:default}button[hidden],[hidden]{display:none!important}
.shell{max-width:1250px;margin:auto;padding:clamp(16px,4vw,54px) clamp(14px,4vw,46px)}
header,.row,.actions,.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header{margin-bottom:26px}.brand{font-size:1.1rem;font-weight:800;display:flex;gap:10px;align-items:center}.brand strong{color:var(--gold)}.brand-mark{width:15px;height:22px;background:var(--gold);border-radius:80% 30% 55% 50%;transform:rotate(-25deg);box-shadow:0 0 16px #ffb14888}
h1,h2,p{margin:0}h1{font-size:clamp(2.2rem,6vw,5rem);line-height:1.04;letter-spacing:-.04em}h2{font-size:clamp(1.45rem,3vw,2.3rem)}p{line-height:1.5}.muted{color:var(--muted)}
.hero,.card{border:1px solid var(--line);border-radius:28px;background:#211c39e8;box-shadow:0 20px 60px #0a081833}
.hero{display:grid;grid-template-columns:1.15fr 1fr;overflow:hidden;min-height:350px}
.hero-copy{padding:clamp(24px,5vw,68px);display:grid;align-content:center;gap:20px}
.hero-art{display:grid;place-items:center;background:radial-gradient(ellipse at center,#633e55 0,transparent 72%),linear-gradient(140deg,#271f43,#332647);min-height:240px;isolation:isolate}
.lights{position:relative;display:flex;direction:ltr;align-items:end;justify-content:center;gap:clamp(5px,1.2vw,18px);padding:40px 8px 29px;width:100%;max-width:490px}
.lights::after{content:"";position:absolute;inset:auto 9% 17px;height:10px;border-radius:8px;background:#e3a951;box-shadow:0 6px 0 #76484a,0 27px 45px #171029}
.candle{position:relative;width:clamp(14px,2.65vw,34px);height:clamp(56px,8vw,130px);border-radius:6px 6px 0 0;background:repeating-linear-gradient(145deg,#ffda8f 0 12px,#bd7761 13px 23px);box-shadow:inset 5px 0 #fff3b03b}
.candle:nth-child(even){height:clamp(70px,10vw,155px);background:repeating-linear-gradient(145deg,#d7bdf6 0 12px,#8e74bd 13px 23px)}
.candle:nth-child(5){height:clamp(92px,14vw,190px);background:repeating-linear-gradient(145deg,#ffe8a4 0 12px,#d69c55 13px 23px)}
.candle::before{content:"";position:absolute;left:50%;top:-34px;width:16px;height:28px;border-radius:85% 35% 55% 55%;background:linear-gradient(#fff2ba,#ffb653 65%,#ff825f);transform:translateX(-50%) rotate(-7deg);box-shadow:0 0 22px 7px #ffaf454f}
.card{padding:clamp(18px,3vw,36px)}.setup{margin-top:18px;display:grid;gap:18px}.settings{display:grid;grid-template-columns:1fr 200px;gap:16px}
label{display:grid;gap:8px;font-weight:700}input,select{color:var(--ink);background:#15112b;border:1px solid #716783;border-radius:12px;min-height:48px;padding:9px 12px;width:100%}
.btn{border:1px solid #675b85;border-radius:12px;background:#332a51;color:var(--ink);min-height:44px;padding:10px 16px;font-weight:800}.btn:hover{background:#483b69}.primary{background:var(--gold);color:#27152d;border-color:var(--gold)}.primary:hover{background:#ffe1a5}.subtle{background:transparent}
.quiz{display:grid;gap:18px}.question-card{display:grid;gap:17px}.prompt{font-size:clamp(1.55rem,4vw,3.5rem);line-height:1.14;text-wrap:balance}.track{height:8px;border-radius:20px;background:#39304e;overflow:hidden}.track span{display:block;height:100%;background:var(--gold);border-radius:inherit;transition:width .25s}.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold)}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answer{display:flex;align-items:center;gap:13px;text-align:right;min-height:84px;padding:clamp(11px,2vw,20px);border:2px solid #64557f;border-radius:16px;background:#2b2347;color:var(--ink);font-weight:800;font-size:clamp(1rem,2vw,1.65rem);overflow-wrap:anywhere}.answer:hover:not(:disabled),.answer.selected{background:#413365;border-color:#d5bbff}.answer.correct{background:#123d31;border-color:var(--green);color:#e6fff0}.letter{display:grid;flex:none;place-items:center;width:35px;height:35px;border-radius:10px;background:#faf3ff16}.answer img{display:block;margin:auto;width:min(100%,165px);border-radius:10px;aspect-ratio:16/10;object-fit:cover}.swatch{width:38px;height:30px;flex:none;border-radius:8px;border:1px solid #cebed4}.math{direction:ltr;unicode-bidi:isolate;display:inline-block}
.note{border:1px solid #944b60;background:#43263c;color:var(--red);border-radius:12px;padding:12px 15px}.feedback{font-weight:800}.feedback.good,.key-green{color:var(--green)}.feedback.bad{color:var(--red)}
.scoreline{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #665982;border-radius:999px;padding:6px 11px;color:var(--muted)}.chip b{color:var(--gold)}.team-list{display:grid;gap:9px}.team-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(135px,235px);gap:14px;align-items:center}details{border-block-start:1px solid var(--line);padding-top:12px}summary{cursor:pointer;font-weight:800}.key-list{display:grid;gap:12px;margin-top:14px}.key-item{display:grid;gap:7px;border:1px solid var(--line);border-radius:12px;padding:12px}.key-options{display:flex;gap:7px 17px;flex-wrap:wrap}.key-options label{display:flex;align-items:center;gap:5px;font-weight:400}.key-options input{width:18px;min-height:18px;accent-color:var(--green)}ol{padding-inline-start:24px}.rank{padding:8px 0;font-size:1.25rem}
@media(max-width:650px){.hero{grid-template-columns:1fr}.hero-art{min-height:175px;grid-row:1}.hero-copy{gap:12px}.settings{grid-template-columns:1fr}.answers{gap:7px}.answer{padding:8px;gap:6px;min-height:68px}.letter{width:26px;height:26px}.card{border-radius:20px}.team-row{gap:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
.live-types{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.live-types .card,.stack{display:grid;gap:14px;align-content:start}.pin{font-size:clamp(3rem,12vw,8rem);line-height:1;font-weight:900;letter-spacing:.12em;color:var(--gold);width:max-content;max-width:100%;direction:ltr}.pin-input{letter-spacing:.16em;text-align:center;direction:ltr}.answer:nth-child(1){background:#593764}.answer:nth-child(2){background:#29416d}.answer:nth-child(3){background:#65402f}.answer:nth-child(4){background:#524777}.answer.selected{border-color:#fff}.answer.correct{background:#123d31;border-color:var(--green)}.answer img{max-width:calc(100% - 40px)}.count{font-size:clamp(1.45rem,5vw,2.6rem);font-weight:900;font-variant-numeric:tabular-nums;min-width:3ch}.game-status{min-height:1.55em}.lobby a{color:#ffdb93}.lobby .scoreline{margin-top:7px}.answer:disabled:not(.correct){opacity:.86}.answer.selected:disabled{opacity:1}.score-rank{display:grid;gap:6px;margin:0;padding-inline-start:30px}.score-rank li{padding:8px 12px;background:#352950;border-radius:8px}.score-rank li span{float:left;color:var(--gold);font-weight:800} @media(max-width:650px){.live-types{grid-template-columns:1fr}.player-question .answers .answer{min-height:86px}.shell{padding-top:17px}header{margin-bottom:13px}}
.qr-canvas{display:block;width:min(360px,100%);height:auto;aspect-ratio:1;background:white;border-radius:12px;image-rendering:pixelated}.join-lobby{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:clamp(20px,5vw,60px)}.join-lobby .stack{align-content:center}@media(max-width:700px){.join-lobby{grid-template-columns:1fr}.qr-canvas{width:min(300px,100%)}}

.question-layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(115px,19vw,230px);align-items:center;gap:clamp(10px,3vw,36px);min-height:115px}
.question-art{width:100%;aspect-ratio:1;background-size:300% 300%;background-repeat:no-repeat;border-radius:20px;border:1px solid #9583af;box-shadow:0 8px 22px #130e27;overflow:hidden;background-color:#3c2e59}
.player-question .question-layout{grid-template-columns:minmax(0,1fr) clamp(90px,20vw,150px);min-height:90px}
@media(max-width:650px){.question-layout,.player-question .question-layout{grid-template-columns:minmax(0,1fr) clamp(82px,23vw,115px);min-height:82px}.question-art{border-radius:12px}.question-layout .prompt{font-size:clamp(1.18rem,4.8vw,1.55rem)}}

.question-layout.has-invite{grid-template-columns:minmax(0,1fr) clamp(100px,18vw,220px) clamp(95px,14vw,148px)}
.late-invite{display:grid;justify-items:center;gap:7px;color:var(--gold);font-weight:800;text-align:center;text-decoration:none;font-size:.86rem}
.late-invite .qr-canvas{width:100%;border-radius:9px}
@media(max-width:560px){.question-layout.has-invite{grid-template-columns:minmax(0,1fr) 84px}.has-invite .late-invite{grid-column:2;grid-row:2}}
</style>
</head>
<body>
<main class="shell">
<header><div class="brand"><span class="brand-mark" aria-hidden="true"></span><span><strong>טכנודע</strong> · חידון חנוכה</span></div><button class="btn subtle" id="fullscreen" type="button">מסך מלא</button></header>
<div id="app"></div>
</main>
<script src="./app.js?v=6fdb02511c8c" defer></script>
</body>
</html>
